<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page {
    size: 6.25in 4.25in;
    margin: 0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 6.25in;
    height: 4.25in;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .front {
    width: 100%;
    height: 100%;
    background: #0f0f0f;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 0.5in 0.4in;
    position: relative;
  }
  .missed-calls-display {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 16px;
    padding: 0.3in 0.4in;
    margin-bottom: 0.25in;
    width: 80%;
    max-width: 4.5in;
    text-align: left;
  }
  .missed-calls-display .header {
    color: #ff4444;
    font-size: 0.28in;
    font-weight: 700;
    margin-bottom: 0.12in;
    letter-spacing: -0.3px;
  }
  .missed-calls-display .entry {
    color: #999;
    font-size: 0.18in;
    line-height: 1.5;
    font-family: 'Courier New', monospace;
  }
  .missed-calls-display .entry span {
    color: #ccc;
  }
  .value-line {
    font-size: 0.35in;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.2;
    margin-bottom: 0.08in;
    letter-spacing: -0.5px;
  }
  .objection-line {
    font-size: 0.22in;
    font-weight: 400;
    color: #888;
    letter-spacing: -0.2px;
  }
  .business-name-tag {
    position: absolute;
    bottom: 0.15in;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 0.14in;
    color: #555;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="front">
    <div class="missed-calls-display">
      <div class="header">3 Missed Calls</div>
      <div class="entry">2:15 PM — <span>(555) 234-5678</span></div>
      <div class="entry">2:18 PM — <span>(555) 234-5678</span></div>
      <div class="entry">3:45 PM — <span>Voicemail: "Need my garage door fixed..."</span></div>
    </div>
    <div class="value-line">Turn missed calls into booked jobs</div>
    <div class="objection-line">No answering service needed</div>
    <div class="business-name-tag">{{business_name}}</div>
  </div>
</body>
</html>
